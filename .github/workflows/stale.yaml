name: Close inactive PRs

on:
  schedule:
    - cron: '30 3 * * *'   # daily at 03:30 UTC
  workflow_dispatch:

permissions:
  actions: write          # lets the action keep its state in the Actions cache
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: -1        # never touch issues, only PRs
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          exempt-pr-labels: 'keep-open'
          stale-pr-message: >
            Dear user, this PR has had no activity for 30 days and has been marked as stale.
            It will be closed in 14 days unless there is new activity
            (a new commit or comment). Thank you for your contribution!
          close-pr-message: >
            Dear user, this PR was closed because it has been inactive for 44 days.
            Feel free to reopen it or open a new PR if you want to continue working on it.
